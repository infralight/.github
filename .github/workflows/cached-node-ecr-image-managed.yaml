name: Reusable NodeJS Build ECR Image

on:
  workflow_call:
    inputs:
      arm64:
        type: boolean
        required: false
        default: false
      node-version:
        default: '1.18.2'
        required: false
        type: string
      custom:
        type: boolean
        required: false
        default: false
      ecr-prefix:
        type: string
        required: false
        default: ''
      run-tests:
        type: boolean
        required: false
        default: false
      trivy-scan:
        type: boolean
        required: false
        default: true
      trivy-slack-notify:
        type: boolean
        required: false
        default: false
      trivy-block:
        type: boolean
        required: false
        default: false
      custom-tests:
        type: boolean
        required: false
        default: false
      cmd-tests:
        type: string
        required: false
        default: "go test ./..."
      app-name:
        type: string
        required: true
      branch:
        type: string
        required: true
      event_name:
        type: string
        required: true
      environment:
        type: string
        default: 'dev'
        required: false
      cluster:
        type: string
        default: 'env2'
        required: false
      latest:
        type: boolean
        required: false
        default: false
      run:
        required: false
        type: string
    secrets:
      GLOBAL_PAT_USERNAME:
        required: true
      GLOBAL_PAT:
        required: true
      CI_AWS_CRED_KEY:
        required: false
      CI_AWS_CRED_SECRET:
        required: false
      CI_REGION:
        required: true
      CI_ACCOUNT_ID:
        required: true
      CI_TRIVY_SLACK:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    if: inputs.run-tests == true
    # 'product' environment maps to the 'prod' runner label
    runs-on: ${{ inputs.environment == 'product' && fromJSON('["self-hosted", "arm64", "prod"]') || fromJSON(format('["self-hosted", "arm64", "{0}"]', inputs.environment)) }}
    name: "Run Tests"
    steps:
      - run: |
          make test-${{ inputs.app-name }}

  build:
    environment: ${{ inputs.environment }}
    name: "Build & Push ECR Docker Image "
    # 'product' environment maps to the 'prod' runner label
    runs-on: ${{ inputs.environment == 'product' && fromJSON('["self-hosted", "arm64", "prod"]') || fromJSON(format('["self-hosted", "arm64", "{0}"]', inputs.environment)) }}
    env:
      HAVE_GLOBAL_PAT: ${{ secrets.GLOBAL_PAT != '' }}
      HAVE_RUN_CMD: ${{ inputs.run != '' }}
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Setup Node v${{ inputs.node-version }}"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Setup QEMU (ARM64)
        if: ${{ inputs.arm64 }}
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: "arm64"

      - name: Configure Git for Private Modules
        if: ${{ env.HAVE_GLOBAL_PAT == 'true' }}
        run: git config --global url."https://${{ secrets.GLOBAL_PAT }}:x-oauth-basic@github.com".insteadOf "https://github.com"


      - name: Node Build
        run: |
          make ci-build-${{ inputs.app-name }} NPM_TOKEN=${{ secrets.GLOBAL_PAT }}

      - name: Docker Build (ARM64)
        id: build-arm64
        if: ${{ inputs.arm64 && env.HAVE_RUN_CMD == 'false' }}
        env:
          CI_ENV: ${{ inputs.environment }}
        run: |
          COMMAND=$(make --dry-run ci-docker-build-${{ inputs.app-name }} ACCESS_TOKEN_USR=${{ secrets.GLOBAL_PAT_USERNAME }} ACCESS_TOKEN_PWD=${{ secrets.GLOBAL_PAT }} NPM_TOKEN=${{ secrets.GLOBAL_PAT }})
          COMMAND=$(echo "$COMMAND" | sed -E 's/docker\s+buildx\s+build/docker buildx build \-\-platform\=linux\/arm64/ig')
          COMMAND=$(echo "$COMMAND" | sed -E 's/docker\s+build\s/docker build \-\-platform\=linux\/arm64 /ig')
          echo "$COMMAND" && echo "$COMMAND" | bash
          docker tag docker.io/library/tempimage ${{ secrets.CI_ACCOUNT_ID }}.dkr.ecr.${{ secrets.CI_REGION }}.amazonaws.com/${{ inputs.app-name }}:latest
          docker tag docker.io/library/tempimage ${{ secrets.CI_ACCOUNT_ID }}.dkr.ecr.${{ secrets.CI_REGION }}.amazonaws.com/${{ inputs.app-name }}:${GITHUB_SHA::6}
          echo "tag=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Docker Build (AMD64)
        id: build
        if: ${{ !inputs.arm64 && env.HAVE_RUN_CMD == 'false' }}
        env:
          CI_ENV: ${{ inputs.environment }}
        run: |
          make ci-docker-build-${{ inputs.app-name }} ACCESS_TOKEN_USR=${{ secrets.GLOBAL_PAT_USERNAME }} ACCESS_TOKEN_PWD=${{ secrets.GLOBAL_PAT }} NPM_TOKEN=${{ secrets.GLOBAL_PAT }}
          docker tag docker.io/library/tempimage ${{ secrets.CI_ACCOUNT_ID }}.dkr.ecr.${{ secrets.CI_REGION }}.amazonaws.com/${{ inputs.app-name }}:latest
          docker tag docker.io/library/tempimage ${{ secrets.CI_ACCOUNT_ID }}.dkr.ecr.${{ secrets.CI_REGION }}.amazonaws.com/${{ inputs.app-name }}:${GITHUB_SHA::6}
          echo "tag=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.CI_ACCOUNT_ID }}:role/${{ inputs.environment }}-github-actions-oidc
          role-session-name: runner
          aws-region: ${{ secrets.CI_REGION }}

      - name: Run Trivy Vulnerability Scanner
        if: ${{ inputs.trivy-scan && inputs.environment == 'dev' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/tempimage
          version: 'v0.69.2'
          format: 'json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: ${{ contains(fromJSON('["prod"]'), inputs.environment) && inputs.environment || inputs.cluster }}-trivy-${{ inputs.app-name }}-results.json

      - name: Upload Trivy Scan Results to S3
        if: ${{ inputs.environment == 'dev' }}
        env:
          TRIVY_RESULT: ${{ contains(fromJSON('["prod"]'), inputs.environment) && inputs.environment || inputs.cluster }}-trivy-${{ inputs.app-name }}-results.json
          S3_BUCKET: firefly-${{ contains(fromJSON('["prod"]'), inputs.environment) && inputs.environment || inputs.cluster }}-trivy-scans
        run: aws s3 cp "./$TRIVY_RESULT" "s3://$S3_BUCKET/$TRIVY_RESULT"

      - name: Count Trivy Findings
        id: trivy-count
        if: ${{ inputs.environment == 'dev' && inputs.trivy-scan && (inputs.trivy-slack-notify || inputs.trivy-block) }}
        env:
          TRIVY_RESULT: ${{ contains(fromJSON('["prod"]'), inputs.environment) && inputs.environment || inputs.cluster }}-trivy-${{ inputs.app-name }}-results.json
        run: |
          if [ ! -f "./$TRIVY_RESULT" ]; then
            echo "no Trivy report at ./$TRIVY_RESULT - nothing to count"
            echo "total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CRITICAL=$(grep -o '"Severity": "CRITICAL"' "./$TRIVY_RESULT" | wc -l | tr -d ' ')
          HIGH=$(grep -o '"Severity": "HIGH"' "./$TRIVY_RESULT" | wc -l | tr -d ' ')
          {
            echo "critical=$CRITICAL"
            echo "high=$HIGH"
            echo "total=$((CRITICAL + HIGH))"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack of Trivy Findings
        if: ${{ inputs.trivy-slack-notify && steps.trivy-count.outputs.total > 0 }}
        uses: rtCamp/action-slack-notify@cdf0a2130cbcdfd82ba5fcac8e076370bf381b36 # v2
        env:
          SLACK_COLOR: ${{ (inputs.trivy-block || steps.trivy-count.outputs.critical > 0) && 'danger' || 'warning' }}
          SLACK_TITLE: "Build Status: ${{ inputs.trivy-block && 'BLOCKED' || 'PASS' }}"
          SLACK_MESSAGE: |
            App: ${{ inputs.app-name }}
            Image tag: ${{ steps.build.outputs.tag || steps.build-arm64.outputs.tag }}
            Findings (fixable only): ${{ steps.trivy-count.outputs.critical }} CRITICAL, ${{ steps.trivy-count.outputs.high }} HIGH
            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>
            Report: s3://firefly-${{ inputs.cluster }}-trivy-scans/${{ inputs.cluster }}-trivy-${{ inputs.app-name }}-results.json
          MSG_MINIMAL: true
          SLACK_USERNAME: trivyBot
          SLACK_FOOTER: "Firefly's Trivy image scan"
          SLACK_WEBHOOK: ${{ secrets.CI_TRIVY_SLACK }}
        continue-on-error: true

      - name: Block on Trivy Findings
        if: ${{ inputs.trivy-block && steps.trivy-count.outputs.total > 0 }}
        run: |
          echo "::error::Trivy found ${{ steps.trivy-count.outputs.critical }} CRITICAL / ${{ steps.trivy-count.outputs.high }} HIGH fixable findings in ${{ inputs.app-name }}; the image was not pushed"
          exit 1

      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@c962da2960ed15f492addc26fffa274485265950 # v2

      - name: Push Docker Image to ECR
        if: (env.HAVE_RUN_CMD == 'false')
        run: |
          docker push ${{ secrets.CI_ACCOUNT_ID }}.dkr.ecr.${{ secrets.CI_REGION }}.amazonaws.com/${{ inputs.app-name }}:${GITHUB_SHA::6}
          if ${{inputs.latest}}; then docker push ${{ secrets.CI_ACCOUNT_ID }}.dkr.ecr.${{ secrets.CI_REGION }}.amazonaws.com/${{ inputs.app-name }}:latest; fi

      - name: "[Build]: build image & upload to ECR - CUSTOM"
        if: ${{ env.HAVE_RUN_CMD == 'true' }}
        run: ${{ inputs.run }}
