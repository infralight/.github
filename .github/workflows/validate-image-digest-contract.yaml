name: Validate image digest contract

on:
  pull_request:
    paths:
      - '.github/workflows/cached-golang-ecr-image-managed.yaml'
      - '.github/workflows/argocd-sync.yaml'
      - '.github/workflows/validate-image-digest-contract.yaml'
      - '.github/tests/test-image-digest-contract.sh'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install yq v4.44.6
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          echo '0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598  /usr/local/bin/yq' | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq

      - name: Install actionlint v1.7.7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sudo install "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint

      - name: Lint workflows
        run: |
          actionlint -ignore 'label "prod" is unknown' \
            .github/workflows/cached-golang-ecr-image-managed.yaml \
            .github/workflows/argocd-sync.yaml \
            .github/workflows/validate-image-digest-contract.yaml

      - name: Test image digest contract
        run: bash .github/tests/test-image-digest-contract.sh
